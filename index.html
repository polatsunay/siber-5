<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="author" content="Sunay Polat">
<meta name="copyright" content="© 2026 Sunay Polat. Tüm hakları saklıdır.">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hacklenen Hesap</title>
<style>
:root{--ink:#16212e;--muted:#617080;--line:#dfe5ec;--soft:#f3f6f9;--blue:#1a66d2;--green:#14924a;--red:#d93636;--amber:#f2a516;--task:42px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#0b1524;font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Masaüstü ---------- */
#desk{position:fixed;inset:0 0 var(--task) 0;background:radial-gradient(ellipse at 70% 20%,#2c5d8f 0,transparent 55%),radial-gradient(ellipse at 10% 90%,#4b2c6f 0,transparent 50%),linear-gradient(160deg,#10243d,#0b1524);overflow:hidden}
#desk::after{content:"⭐ YILDIZ KOLEJİ";position:absolute;right:28px;bottom:16px;font-weight:900;letter-spacing:4px;color:#ffffff12;font-size:34px;pointer-events:none}
.icons{position:absolute;left:14px;top:14px;display:grid;gap:6px}
.dicon{width:86px;padding:8px 4px;border:0;background:none;color:#fff;text-align:center;border-radius:10px;position:relative}
.dicon:hover,.dicon:focus-visible{background:#ffffff1f;outline:none}
.dicon .ic{font-size:34px;display:block;filter:drop-shadow(0 2px 3px #0006)}
.dicon span{font-size:13px;text-shadow:0 1px 2px #000}
.badge{position:absolute;top:4px;right:16px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 6px}
.sticky{position:absolute;left:120px;bottom:24px;width:190px;background:#fff59d;padding:12px 14px;border-radius:3px;box-shadow:0 8px 18px #0006;transform:rotate(-3deg);font-family:"Segoe Print","Comic Sans MS",cursive;font-size:14px;line-height:1.55;color:#3a3200}

/* ---------- Görev çubuğu ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--task);background:#0b1320f2;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:0 8px;color:#e9eef5;border-top:1px solid #ffffff14;z-index:9000}
.tstart{font-weight:900;padding:6px 10px;border-radius:8px;white-space:nowrap}
.tapps{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.tapp{border:0;background:#ffffff10;border-radius:8px;padding:6px 10px;white-space:nowrap;font-size:13px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tapp.act{background:#ffffff2a;box-shadow:inset 0 -2px 0 #6cb4ff}
.count{font-variant-numeric:tabular-nums;font-weight:900;background:#d93636;border-radius:8px;padding:5px 10px;white-space:nowrap}
.count.ok{background:var(--green)}
.count.low{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.tbtn{border:0;background:#ffffff14;border-radius:8px;padding:6px 10px;white-space:nowrap}
.clock{font-size:13px;text-align:right;line-height:1.15;white-space:nowrap;padding:0 4px}

/* ---------- Pencereler ---------- */
.win{position:absolute;background:#fff;border-radius:10px;box-shadow:0 18px 50px #000a,0 0 0 1px #0003;display:flex;flex-direction:column;overflow:hidden;min-width:300px;min-height:200px}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.wbar{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;background:#eef1f5;border-bottom:1px solid var(--line);cursor:grab;user-select:none;flex:none}
.win.front .wbar{background:#e3e9f1}
.wbar b{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar button{border:0;background:none;width:32px;height:28px;border-radius:6px;font-size:14px}
.wbar button:hover{background:#0001}.wbar .x:hover{background:#e5383b;color:#fff}
.wbody{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- Ortak ---------- */
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;background:var(--blue);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.gray{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.inp{width:100%;padding:9px 11px;border:1px solid #c9d3de;border-radius:8px;background:#fff}
.inp:focus{outline:2px solid #9cc3ff;border-color:var(--blue)}
.note{padding:9px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.note.bad{background:#fdecec;color:#9b1c1c}.note.good{background:#e7f6ec;color:#0e6b35}.note.info{background:#eef4ff;color:#1b4b91}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Posta ---------- */
.mail{display:grid;grid-template-columns:250px 1fr;height:100%}
.mside{border-right:1px solid var(--line);overflow:auto;background:#fafbfc}
.mtools{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:#f6f8fa;flex-wrap:wrap}
.mitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px}
.mitem:hover{background:#eef4ff}.mitem.sel{background:#dde9fb}
.mitem.unread b{font-weight:900}.mitem.unread::before{content:"";float:right;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px}
.mitem b{display:block;font-weight:600;font-size:14px}.mitem span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mitem small{color:var(--muted);font-size:12px}
.mitem.rep{opacity:.5;text-decoration:line-through}
.mfold{display:flex;flex-direction:column;padding:6px;border-bottom:1px solid var(--line);background:#f1f4f8}
.mfold button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between}
.mfold button.on{background:#dde9fb;font-weight:700}.mfold i{font-style:normal;background:var(--blue);color:#fff;border-radius:99px;padding:0 7px;font-size:11px}
.mempty{padding:20px;color:var(--muted);font-size:13px;text-align:center}
.cmp{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbfd}
.cmp>div{font-size:14px;margin-bottom:6px}.cmp span{color:var(--muted)}
.cmp textarea{resize:vertical;margin-top:4px}
.mquote{margin-top:14px;padding-left:12px;border-left:3px solid var(--line);color:var(--muted);font-size:14px}
.mread{display:flex;flex-direction:column;min-width:0}
.mcontent{padding:16px 20px;overflow:auto;flex:1;line-height:1.6}
.mcontent h2{margin:0 0 8px;font-size:20px}
.mfrom{display:flex;gap:10px;align-items:center;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);font-size:14px}
.mfrom .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.mfrom code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:13px;word-break:break-all}
.mlink{color:var(--blue);text-decoration:underline;cursor:pointer}
.mbutton{display:inline-block;background:#1a66d2;color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;margin:6px 0}
.status{height:24px;flex:none;font-size:12px;color:#fff;background:#3b4654;padding:4px 10px;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Tarayıcı ---------- */
.brw{display:flex;flex-direction:column;height:100%}
.btabs{display:flex;background:#dfe4ea;padding:6px 6px 0}
.btab{background:#fff;border-radius:8px 8px 0 0;padding:6px 14px;font-size:13px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnav{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line)}
.bnav>button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:16px}
.bnav>button:hover{background:var(--soft)}
.addr{flex:1;display:flex;align-items:center;gap:6px;background:#f1f3f5;border-radius:99px;padding:0 6px 0 12px;border:2px solid transparent}
.addr:focus-within{background:#fff;border-color:#9cc3ff}
.addr .sec{font-size:12px;white-space:nowrap;padding:2px 8px;border-radius:99px}
.addr .sec.ok{color:#0e6b35}.addr .sec.bad{background:#fde3e3;color:#a11}
.addr input{flex:1;border:0;background:none;padding:8px 2px;outline:none;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.bpage{flex:1;overflow:auto;position:relative}
/* Arama motoru */
.search{max-width:640px;margin:0 auto;padding:40px 20px}
.slogo{font-size:40px;font-weight:900;text-align:center;letter-spacing:-1px;margin-bottom:18px}
.slogo b:nth-child(1){color:#1a66d2}.slogo b:nth-child(2){color:#d93636}.slogo b:nth-child(3){color:#f2a516}.slogo b:nth-child(4){color:#14924a}
.sbox{display:flex;gap:8px}
.res{padding:12px 0;border-bottom:1px solid var(--line)}
.res small{color:#3b6e2f;font-family:ui-monospace,Consolas,monospace}
.res a{display:block;color:#1a0dab;font-size:18px;cursor:pointer;margin:2px 0}
.res a:hover{text-decoration:underline}
.res p{margin:2px 0;color:#4d5156;font-size:14px}
.ad{font-weight:800;color:#202124;font-size:12px;margin-right:6px}
/* Okul siteleri */
.site{min-height:100%;background:#f4f7fb}
.shead{background:#123a6b;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.shead small{font-weight:500;opacity:.8;font-size:13px}
.login{max-width:360px;margin:34px auto;background:#fff;border-radius:12px;box-shadow:0 6px 22px #0001;padding:24px}
.login h3{margin:0 0 4px;text-align:center}
.login label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.urgent{background:#fde3e3;color:#a11;font-weight:700;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:12px;text-align:center}
.portal{display:grid;grid-template-columns:200px 1fr;min-height:calc(100% - 55px)}
.pside{background:#fff;border-right:1px solid var(--line);padding:10px}
.pside button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:14px}
.pside button:hover{background:var(--soft)}.pside button.on{background:#e3edfb;color:#123a6b;font-weight:700}
.pside h5{margin:12px 8px 4px;color:var(--muted);font-size:11px;letter-spacing:1px}
.pmain{padding:20px 24px}
.pmain h3{margin:0 0 12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.sess{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.sess .ic{font-size:26px}
.sess .g{flex:1}.sess small{color:var(--muted);display:block}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#e7f6ec;color:#0e6b35}
.tag.red{background:#fde3e3;color:#a11}
.rules{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px;font-size:13px}
.rules li{color:#a11}.rules li.ok{color:#0e6b35}
.rules li::before{content:"✖ "}.rules li.ok::before{content:"✔ "}
.sched{border-left:4px solid var(--red)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}
.radio input{margin-top:4px}
.nf{text-align:center;padding:60px 20px;color:var(--muted)}
.nf .big{font-size:56px}

/* ---------- Paylaş (sosyal medya) ---------- */
.soc{max-width:640px;margin:0 auto;padding:16px}
.sprof{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.sprof .av{width:76px;height:76px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#e91e63,#7b1fa2);display:grid;place-items:center;font-size:36px;flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.tog{width:48px;height:28px;border-radius:99px;border:0;background:#c7cfd8;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--green)}.tog.on::after{left:23px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.post{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative}
.post .ph{height:100px;display:grid;place-items:center;font-size:44px}
.post p{margin:0;padding:8px 10px;font-size:13px;line-height:1.45}
.post small{display:block;color:var(--muted);padding:0 10px 8px;font-size:12px}
.post .more{position:absolute;top:6px;right:6px;border:0;background:#fffd;border-radius:99px;width:30px;height:30px;font-weight:900}
.post .menu{position:absolute;top:40px;right:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 16px #0002;z-index:2;overflow:hidden}
.post .menu button{display:block;border:0;background:none;padding:9px 14px;width:100%;text-align:left;font-size:13px}
.post .menu button:hover{background:var(--soft)}

/* ---------- Telefon ---------- */
.phone{height:100%;display:flex;flex-direction:column;background:#f1f3f6}
.pbar{display:flex;justify-content:space-between;padding:6px 14px;font-size:12px;font-weight:700;background:#fff}
.threads .th{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px}
.th .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#8a99a8;color:#fff;flex:none}
.th .g{flex:1;min-width:0}.th .g span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.unread b::after{content:" ●";color:var(--blue)}
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;background:#fff;line-height:1.45;font-size:14px;box-shadow:0 1px 1px #0001}
.bub.me{align-self:flex-end;background:#1a66d2;color:#fff}
.bub small{display:block;font-size:11px;opacity:.6;margin-top:3px}
.reply{display:flex;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--line)}

/* ---------- Görevler ---------- */
.tasks{padding:12px}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;margin-bottom:6px;background:var(--soft)}
.tk .c{width:22px;height:22px;border-radius:50%;border:2px solid #9fb0c3;flex:none;display:grid;place-items:center;font-size:12px;font-weight:900}
.tk.done{background:#e7f6ec}.tk.done .c{background:var(--green);border-color:var(--green);color:#fff}
.tk.done b{text-decoration:line-through;color:#3b7a52}
.tk small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--green);transition:.4s}

/* ---------- Bildirimler ---------- */
#toasts{position:fixed;left:110px;bottom:calc(var(--task) + 12px);display:flex;flex-direction:column;gap:8px;z-index:9500;width:min(340px,calc(100% - 24px))}
.toast{background:#1d2633f2;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px #0008;font-size:14px;line-height:1.45;animation:in .3s ease;border-left:4px solid #6cb4ff}
.toast.bad{border-color:#ff5c5c}.toast.good{border-color:#4ade80}
.toast b{display:block;margin-bottom:2px}
@keyframes in{from{transform:translateX(30px);opacity:0}}

/* ---------- Hacklenme animasyonu ---------- */
#hack{position:fixed;inset:0;z-index:9900;background:#020703;color:#39ff6a;font:clamp(14px,2vw,20px)/1.7 ui-monospace,Consolas,monospace;padding:6vh 6vw;white-space:pre-wrap;transition:opacity .5s}
#hack.glitch{animation:glitch .18s steps(2) 8;color:#ff4d4d}
#hack.out{opacity:0}
#hack .big{display:block;margin-top:20px;font-size:clamp(26px,5vw,56px);font-weight:900;color:#ff4d4d;text-shadow:3px 0 #00e5ff,-3px 0 #ff00c8}
@keyframes glitch{0%{background:#200;transform:translateX(-4px)}50%{background:#020703;transform:translateX(4px)}}
/* ---------- Gelen arama ---------- */
#call{position:fixed;inset:0;z-index:9700;display:grid;place-items:center;background:#0009;padding:16px}
.callcard{width:min(380px,100%);background:linear-gradient(180deg,#1f3b57,#0d1b2a);color:#fff;border-radius:28px;padding:26px 22px;text-align:center;box-shadow:0 30px 80px #000c}
.callcard .av{width:84px;height:84px;border-radius:50%;background:#3c5a78;display:grid;place-items:center;font-size:40px;margin:0 auto 10px}
.callcard.ringing .av{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #ffffff22}}
.callcard h3{margin:4px 0}.callcard small{opacity:.75}
.cbtns{display:flex;justify-content:space-around;margin-top:26px}
.cbtns button{width:66px;height:66px;border-radius:50%;border:0;font-size:28px;color:#fff}
.cbtns small{display:block;margin-top:6px}
.lines{text-align:left;margin-top:16px;display:grid;gap:8px;max-height:40vh;overflow:auto}
.lines div{background:#ffffff1c;border-radius:14px;padding:9px 12px;line-height:1.45;animation:in .3s}
.copts{display:grid;gap:8px;margin-top:14px}
.copts button{border:0;border-radius:12px;padding:11px 12px;background:#ffffff;color:#16212e;font-weight:700;text-align:left}
.copts button:hover{background:#e3edfb}
/* ---------- Sahte virüs uyarısı ---------- */
#virus{position:fixed;inset:0 0 var(--task) 0;z-index:9600;display:grid;place-items:center;background:#0006;padding:12px}
.vwin{width:min(620px,100%);background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px #000c}
.vwin .vurl{display:flex;align-items:center;gap:8px;background:#eef1f5;padding:7px 10px;font:13px ui-monospace,Consolas,monospace}
.vwin .vurl span{flex:1;background:#fff;border-radius:99px;padding:4px 10px}
.vwin .vurl .bad{flex:none;background:#fde3e3;color:#a11;font-family:system-ui;font-size:12px}
.vwin .vx{border:0;background:none;font-size:18px;width:30px;height:30px;border-radius:6px}
.vwin .vx:hover{background:#e5383b;color:#fff}
.vbody{background:#c40e0e;color:#fff;padding:22px;text-align:center;animation:vblink .8s steps(2) infinite}
@keyframes vblink{50%{background:#9e0b0b}}
.vbody h2{margin:6px 0;font-size:clamp(20px,3.4vw,30px)}
.vbody .cnt{font:900 34px ui-monospace,Consolas,monospace;margin:8px 0}
.vbody .vbig{background:#ffd60a;color:#111;border:0;border-radius:10px;padding:14px 22px;font-size:19px;font-weight:900;margin:6px}
.vbody .vcall{background:#fff;color:#c40e0e;border:0;border-radius:10px;padding:10px 16px;font-weight:800;margin:6px}
.vfoot{padding:8px 12px;font-size:12px;color:#8a96a3;text-align:right}
.vfoot a{color:#8a96a3;cursor:pointer;text-decoration:underline}
/* ---------- Konfeti ---------- */
#confetti{position:fixed;inset:0;z-index:9950;pointer-events:none}
.quick{display:grid;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--line)}
.quick button{border:1px solid var(--line);background:#f6f9fd;border-radius:12px;padding:9px 10px;text-align:left;font-size:13px;font-weight:600}
.quick button:hover{background:#e3edfb}
.ztabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ztabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}
.ztabs button.on{background:#16212e;color:#fff;border-color:#16212e}
.zprof{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;position:relative}
.zprof .av{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:36px;flex:none}
.zmenu{position:absolute;right:0;top:100%;z-index:3;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px #0002;overflow:hidden}
.zmenu button{display:block;width:100%;border:0;background:none;padding:10px 16px;text-align:left;font-size:14px}
.zmenu button:hover{background:var(--soft)}

function GS(){return S&&GSC[S.sc]||null}
function DF(){return S?({kolay:.5,normal:1,zor:1.5}[S.diff||'normal']||1):1}
function A(x){return x&&typeof x==='object'?(x[(S&&S.diff)||'normal']||x.normal):x}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rng(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a}
function logE(k,a,b){if(!S||!S.start)return;S.log=S.log||[];S.log.push({t:Math.round(elapsed()),k:k,a:String(a||''),b:String(b||'')})}
function needOk(n){return n.indexOf('ev:')===0?!!S.events[n.slice(3)]:done(n)}
function gDef(k){var g=GS();return (g.threads||[]).filter(function(t){return t.k===k})[0]}
function gThread(def){
 var th=S.phone.threads[def.k]={name:def.name,av:def.av,msgs:def.msgs.map(function(t){return {t:t,me:false,at:now5()}}),quick:def.quick,retry:def.retry!==false,unread:true};
 S.phone.order=[def.k].concat(S.phone.order.filter(function(k){return k!==def.k}));

}

function gEff(e){
 if(!e)return;
 if(e.pen)penalty(e.pen[0],e.pen[1],e.pen[2]);
 if(e.bonus){var k='b:'+e.bonus[1];if(!S.g.once[k]){S.g.once[k]=1;bonus(e.bonus[0],e.bonus[1],e.bonus[2])}}

function gClean(u){return norm(u).replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,'')}

 var g=GS(),c=gClean(u);
 if(c===''||c==='ara')return {k:'home'};
 if(c.indexOf('ara?q=')===0)return {k:'search',q:decodeURIComponent(c.slice(6))};
 if(g.sites[c])return {k:'site',key:c};
 var host=c.split('/')[0];
 if(g.sites[host])return {k:'site',key:host};
 if(c.indexOf('.')<0||c.indexOf(' ')>=0)return {k:'search',q:String(u).trim()};
 return {k:'nf',url:c};
}

function gTick(l){
 var g=GS(),c=$('count'),e=elapsed();
 c.textContent='⏱ '+fmt(l);c.className='count'+(l<120?' low':'');
 if(l<=0&&!S.sent){S.sent=true;save();toast('⏰ Süre doldu',g.timeout,'bad')}
 (g.events||[]).forEach(function(ev,i){
  var id=ev.id||('e'+i);if(S.events[id]||e<ev.at||S.done)return;

function tick(){
 var d=new Date();$('clock').innerHTML=d.toTimeString().slice(0,5)+'<br>'+d.toLocaleDateString('tr-TR');
 if(!S||!S.start)return;
 var l=left(),c=$('count');
 if(S.done){c.textContent=GS()?'✅ Tamamlandı':S.sc==='zorba'?'✅ Durduruldu':'✅ Kurtarıldı';c.className='count ok';return}
 if(S.sc==='zorba'){zTick(l);return}
 if(GS()){gTick(l);return}
 if(!S.hacker.schedOn&&!S.hacker.active){c.textContent='✅ Gönderi iptal';c.className='count ok'}
 else{c.textContent='⏱ '+fmt(l);c.className='count'+(l<120?' low':'')}
 if(S.hacker.recreateAt&&Date.now()>=S.hacker.recreateAt){S.hacker.recreateAt=0;if(!S.hacker.active){save();complete('sched')}else{S.hacker.schedOn=true;save();toast('😈 Gönderi geri geldi!','Bilinmeyen cihaz zamanlanmış mesajı yeniden oluşturdu. Dolandırıcı hâlâ hesapta!','bad');refresh('browser')}}
 if(l<=0&&S.hacker.schedOn&&!S.sent){S.sent=true;save();toast('📤 Sahte mesaj gönderildi','Süre doldu; dolandırıcının mesajı velilere gitti. Yine de hesabı kurtarmaya devam edin!','bad')}
 if(S.br.logged&&S.br.tab==='zaman'&&wins.browser){var tg=document.querySelector('.sched .tag');if(tg)tg.textContent=l>0?fmt(l)+' sonra gönderilecek':'Gönderildi'}
 // zamanlı olaylar
 var e=elapsed();
 if(e>4&&!S.events.alert){S.events.alert=1;save();toast('🚨 Güvenlik uyarısı','Hesabınıza bugün 03:12\'de bilinmeyen bir cihazdan giriş yapıldı.','bad')}
 if(e>40&&!S.events.hello){S.events.hello=1;sms('anon','Bilinmeyen','Hesabınız artık bende 😈 Süre dolunca velilerinize güzel bir “aidat” mesajı gidecek. Durdurabilirseniz durdurun!')}
